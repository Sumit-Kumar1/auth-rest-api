services:
  auth-api:
    build:
      context: .
      args:
        PORT: 9001
    container_name: auth-api
    ports:
      - "${HTTP_PORT:-9001}:9001"
    env_file:
      - configs/.env
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=9001
      - DB_HOST=auth-db
      - DB_PORT=6379
      - DB_NAME=0
      - LOG_LEVEL=DEBUG
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=auth-rest-api
    depends_on:
      auth-db:
        condition: service_healthy
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: 3
    networks:
      - backend_auth_bridge # EXTERNAL: Talks to Todo Backend
      - auth_db_net # INTERNAL: Talks to Redis
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://${HTTP_HOST}:${HTTP_PORT}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
  auth-db:
    container_name: auth-db
    image: redis:8-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - auth_db_net
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: 3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
networks:
  backend_auth_bridge: # manual created net
    external: true
  auth_db_net:
    driver: bridge
    name: auth_db_net
    # internal: true

volumes:
  redis-data:
